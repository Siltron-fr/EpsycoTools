<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrice de compatibilité · Epsyco</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06070b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<link rel="stylesheet" href="../style/style.css">
<script src="../js/update-check.js"></script>
<link rel="icon" type="image/png" href="../assets/logo.webp" />
</head>
<body data-page="matrix">
<div class="shell">
  <script src="../js/nav.js"></script>
  <div class="content">
    <div class="split" id="split">
      <main id="wrap"></main>
      <aside>
        <header class="ph">
          <div class="ph-title">
            <h1>Matrice de compatibilité</h1>
            <p class="hint" id="hint" aria-live="polite"></p>
          </div>
          <button class="icon-btn" id="btnMatrix" aria-pressed="false" aria-label="Afficher la matrice" title="Afficher la matrice"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
        </header>
        <div class="tools">
          <input class="search" id="search" type="search" placeholder="Chercher un job" aria-label="Chercher un job" autocomplete="off">
          <button class="icon-btn star-btn" id="btnStars" aria-pressed="true" aria-label="Masquer les étoiles" title="Masquer les étoiles"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg></button>
          <button class="btn sm" id="btnClear" disabled>Tout décocher</button>
        </div>
        <div class="legend" aria-label="Légende">
          <span class="lg sel">Sélection</span>
          <span class="lg ok">Compatible</span>
          <span class="lg warn">Sous conditions</span>
          <span class="lg bad">Incompatible</span>
        </div>
        <div id="panelBody"></div>
        <p class="credit"><a href="https://google.com" target="_blank" rel="noopener">Merci à Mimoushi pour les données originelles</a></p>
      </aside>
    </div>
  </div>
</div>
<script src="../js/matrix-data.js"></script>
<script src="../js/script.js"></script>
</body>
</html>
